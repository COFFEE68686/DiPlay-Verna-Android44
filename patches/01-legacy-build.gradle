# Legacy Android 4.4.4 compatibility patch: build config

This file is a drop-in compatibility sketch for the upstream DiPlay project.
It intentionally preserves only the minimal USB/basic CarPlay flow and removes
newer Android API assumptions.

```gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'com.android.application' version '7.4.2' apply false
    id 'com.android.library' version '7.4.2' apply false
}
```

```gradle
// shared/build.gradle
plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 28

    defaultConfig {
        minSdk = 19
        targetSdk = 28
        multiDexEnabled = true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-19'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    ndkVersion = '26.3.11579264'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'

    implementation 'org.bouncycastle:bcprov-jdk15to18:1.77'
    implementation 'com.j256.ormlite:ormlite-core:6.1'
}
```

```gradle
// mobile/build.gradle (compatibility-oriented minimal version)
plugins {
    id 'com.android.application'
}

android {
    compileSdk = 28

    defaultConfig {
        applicationId = 'com.shihab.diplay'
        minSdk = 19
        targetSdk = 28
        versionCode = 1
        versionName = '0.1.0-legacy'
        multiDexEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
```

Why this matters:
- Android 4.4.4 is API 19
- the upstream project targets API 28+ and Java 11
- compatibility must be reduced before any runtime behavior is attempted
